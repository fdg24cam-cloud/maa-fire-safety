<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="MAA Checks">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>MAA Fire Safety Checks</title>
<style>
:root{--navy:#17324d;--blue:#245c87;--ink:#1e2b35;--muted:#64727d;--bg:#f5f7f8;--card:#fff;--line:#dde3e7;--green:#166534;--red:#b42318;--amber:#7a4d00}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{padding-bottom:env(safe-area-inset-bottom)}header{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px}header h1{font-size:22px;margin:0 0 4px}header p{margin:0;opacity:.78;font-size:13px}main{max-width:760px;margin:auto;padding:18px}.hidden{display:none!important}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;margin:5px 0 12px}.grid{display:grid;gap:12px}.card,.location-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px #0000000b}.card h3{margin:0 0 5px;font-size:17px}.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.meta{font-size:13px;color:var(--muted);line-height:1.4}.status{font-size:12px;font-weight:800;border-radius:999px;padding:5px 9px;white-space:nowrap}.due{background:#fee4e2;color:var(--red)}.complete{background:#dcfae6;color:var(--green)}.soon{background:#fff1c2;color:var(--amber)}
button,.btn{border:0;border-radius:11px;padding:12px 14px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#e8edf1;color:var(--ink)}.full{width:100%}.top-actions{display:flex;gap:8px;margin-bottom:12px}.progress-wrap{height:9px;background:#e6ebef;border-radius:99px;overflow:hidden;margin:12px 0 16px}.progress{height:100%;background:var(--navy);width:0}.counter{font-size:13px;color:var(--muted);font-weight:800}.loc-id{font-size:13px;color:var(--muted);font-weight:750}.loc{font-size:22px;line-height:1.25;margin:8px 0 18px;font-weight:800}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{background:#edf1f4;color:#26323d;padding:15px 8px}.choice.selected.pass{background:#dcfae6;color:var(--green);outline:2px solid #86d8a4}.choice.selected.fail{background:#fee4e2;color:var(--red);outline:2px solid #ff9b94}.choice.selected.issue{background:#fff1c2;color:var(--amber);outline:2px solid #e8bd4c}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #c8d1d7;border-radius:10px;background:#fff;padding:12px;font:inherit;font-size:16px}.field textarea{min-height:76px;resize:vertical}.nav{display:flex;gap:8px;margin-top:15px}.nav button{flex:1}.summary-row,.history-item{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid #edf0f2;padding:10px 0}.history-item{justify-content:space-between}.pill{font-size:11px;font-weight:850;border-radius:999px;padding:4px 7px;min-width:53px;text-align:center}.pill.pass{background:#dcfae6;color:var(--green)}.pill.fail{background:#fee4e2;color:var(--red)}.pill.issue{background:#fff1c2;color:var(--amber)}.notice{background:#eef5fb;border:1px solid #cfe0ed;border-radius:13px;padding:12px 14px;margin-bottom:14px;font-size:13px}.success{background:#eef8f0;border-color:#bddfc7}.install{display:none}.install.show{display:block}.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.action-row button{flex:1;min-width:130px}.small{font-size:12px}.danger-link{color:var(--red);background:none;padding:0;font-weight:700}
@media(max-width:520px){main{padding:14px}.choices{grid-template-columns:1fr}.choice{padding:12px}.nav{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));background:#f5f7f8e8;backdrop-filter:blur(7px);padding:8px;border-radius:14px}.loc{font-size:20px}}
</style></head><body>
<header><h1>MAA Fire Safety Checks</h1><p>Inspection checklist · official PDF export</p></header>
<main>
<div id="installHint" class="notice install"><b>Install on iPhone:</b> in Safari tap <b>Share</b> → <b>Add to Home Screen</b>.</div>
<section id="dashboard"><div class="section-title">Scheduled checks</div><div id="testGrid" class="grid"></div><div style="height:24px"></div><div class="section-title">Inspection history on this device</div><div class="card"><div id="history"></div></div></section>
<section id="runner" class="hidden"><div class="top-actions"><button class="secondary" onclick="goDashboard()">← Dashboard</button></div><div class="card"><div class="row"><div><h3 id="runTitle"></h3><div id="runFreq" class="meta"></div></div><div id="counter" class="counter"></div></div><div class="progress-wrap"><div id="progress" class="progress"></div></div><div class="field"><label>Inspection date</label><input id="inspectionDate" type="date"></div><div class="field"><label>Initials</label><input id="initials" value="F.G." maxlength="10"></div></div><div style="height:12px"></div><div class="location-card"><div id="locId" class="loc-id"></div><div id="loc" class="loc"></div><div class="choices"><button class="choice pass" onclick="choose('PASS')">✓ PASS</button><button class="choice fail" onclick="choose('FAIL')">✕ FAIL</button><button class="choice issue" onclick="choose('ISSUE')">! ISSUE</button></div><div class="field"><label>Fault / action notes <span class="meta">(saved in app history)</span></label><textarea id="notes" placeholder="Optional"></textarea></div><div class="nav"><button class="secondary" onclick="prev()">Previous</button><button class="primary" onclick="next()">Save & Next</button></div></div></section>
<section id="review" class="hidden"><div class="top-actions"><button class="secondary" onclick="backToRunner()">← Back</button></div><div class="card"><h3>Review inspection</h3><div id="summary"></div><button id="completeBtn" class="primary full" onclick="completeRun()">Generate official PDF</button><div id="resultBox"></div></div></section>
</main>
<script>
const STORE='maaFireChecksHistoryV2', DRAFT='maaFireChecksDraftV2';
let tests=[], current=null, locations=[], answers=[], idx=0, currentCfg=null, pdfBlob=null, pdfName='';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function getHistory(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return[]}}
function saveHistory(h){localStorage.setItem(STORE,JSON.stringify(h.slice(0,100)))}
function addMonths(iso,n){const d=new Date(iso+'T12:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.toISOString().slice(0,10)}
function fmt(s){if(!s)return'';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function statusFor(t){const h=getHistory().filter(x=>x.test_id===t.id).sort((a,b)=>b.inspection_date.localeCompare(a.inspection_date));if(!h.length)return{state:'due',label:'Due',last:null,next:null};const last=h[0].inspection_date,next=addMonths(last,t.months),today=new Date().toISOString().slice(0,10);const days=Math.ceil((new Date(next+'T12:00:00')-new Date(today+'T12:00:00'))/86400000);if(today>=next)return{state:'due',label:'Due',last,next};if(days<=14)return{state:'soon',label:'Due soon',last,next};return{state:'complete',label:'Up to date',last,next}}
async function api(url,opts){const r=await fetch(url,opts);if(!r.ok){let msg='Request failed';try{msg=(await r.json()).error||msg}catch{}throw new Error(msg)}return r}
function show(id){['dashboard','runner','review'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}
async function loadDashboard(){try{const r=await api('/api/tests');const data=await r.json();tests=data.tests;renderDashboard()}catch(e){$('testGrid').innerHTML=`<div class="notice">The app needs an internet connection the first time it opens. ${esc(e.message)}</div>`}}
function renderDashboard(){$('testGrid').innerHTML=tests.map(t=>{const s=statusFor(t);return `<div class="card"><div class="row"><div><h3>${esc(t.name)}</h3><div class="meta">${esc(t.frequency)} · ${t.count} checks</div></div><span class="status ${s.state}">${esc(s.label)}</span></div><p class="meta">${esc(t.description)}</p>${s.last?`<div class="meta">Last: ${fmt(s.last)} · Next due: ${fmt(s.next)}</div>`:'<div class="meta">No completed record on this device</div>'}<div style="height:12px"></div><button class="primary full" onclick="start('${t.id}')">Start inspection</button></div>`}).join('');renderHistory()}
function renderHistory(){const h=getHistory();$('history').innerHTML=h.length?h.slice(0,20).map((r,i)=>`<div class="history-item"><div><b>${esc(r.test_name)}</b><div class="meta">${fmt(r.inspection_date)} · ${esc(r.initials)} · ${r.failures||0} faults/issues</div></div><button class="danger-link small" onclick="deleteHistory(${i})">Delete</button></div>`).join(''):'<div class="meta">No completed inspections yet.</div>'}
function deleteHistory(i){const h=getHistory();if(confirm('Delete this history entry from this device?')){h.splice(i,1);saveHistory(h);renderDashboard()}}
async function start(id){try{current=id;const r=await api('/api/test/'+id);currentCfg=await r.json();locations=currentCfg.locations;answers=locations.map(()=>({result:'',notes:''}));idx=0;$('runTitle').textContent=currentCfg.name;$('runFreq').textContent=currentCfg.frequency;$('inspectionDate').value=new Date().toISOString().slice(0,10);$('initials').value='F.G.';const draft=loadDraft(id);if(draft&&confirm('Resume the unfinished '+currentCfg.name+' inspection?')){answers=draft.answers;idx=Math.min(draft.idx,locations.length-1);$('inspectionDate').value=draft.inspection_date;$('initials').value=draft.initials}renderLoc();show('runner')}catch(e){alert(e.message)}}
function saveDraft(){if(!current)return;localStorage.setItem(DRAFT,JSON.stringify({test_id:current,answers,idx,inspection_date:$('inspectionDate').value,initials:$('initials').value}))}
function loadDraft(id){try{const d=JSON.parse(localStorage.getItem(DRAFT)||'null');return d&&d.test_id===id?d:null}catch{return null}}
function clearDraft(){localStorage.removeItem(DRAFT)}
function renderLoc(){const a=answers[idx];$('counter').textContent=`${idx+1} / ${locations.length}`;$('progress').style.width=`${Math.round(((idx+(a.result?1:0))/locations.length)*100)}%`;$('locId').textContent=locations[idx].id?`ID ${locations[idx].id}`:'';$('loc').textContent=locations[idx].location;$('notes').value=a.notes||'';document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));if(a.result){const b=document.querySelector('.choice.'+a.result.toLowerCase());if(b)b.classList.add('selected')}}
function choose(v){answers[idx].result=v;document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice.'+v.toLowerCase()).classList.add('selected');saveDraft()}
function saveNotes(){answers[idx].notes=$('notes').value.trim();saveDraft()}
function next(){saveNotes();if(!answers[idx].result){alert('Select PASS, FAIL or ISSUE before continuing.');return}if(idx<locations.length-1){idx++;saveDraft();renderLoc();window.scrollTo(0,0)}else openReview()}
function prev(){saveNotes();if(idx>0){idx--;saveDraft();renderLoc()}}
function openReview(){saveNotes();const missing=answers.findIndex(a=>!a.result);if(missing>=0){idx=missing;renderLoc();alert('There are checks without a result.');return}$('summary').innerHTML=locations.map((l,i)=>`<div class="summary-row"><span class="pill ${answers[i].result.toLowerCase()}">${answers[i].result}</span><div><b>${esc(l.location)}</b>${answers[i].notes?`<div class="meta">${esc(answers[i].notes)}</div>`:''}</div></div>`).join('');$('resultBox').innerHTML='';show('review')}
function backToRunner(){show('runner');renderLoc()}
async function completeRun(){const b=$('completeBtn');b.disabled=true;b.textContent='Generating PDF…';$('resultBox').innerHTML='';try{const payload={test_id:current,inspection_date:$('inspectionDate').value,initials:$('initials').value,results:answers};const r=await api('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});pdfBlob=await r.blob();const cd=r.headers.get('content-disposition')||'';pdfName=(cd.match(/filename="?([^";]+)"?/i)||[])[1]||`MAA_${current}_${payload.inspection_date}.pdf`;const h=getHistory();h.unshift({test_id:current,test_name:currentCfg.name,inspection_date:payload.inspection_date,initials:payload.initials,completed_at:new Date().toISOString(),failures:answers.filter(a=>a.result!=='PASS').length,results:answers});saveHistory(h);clearDraft();$('resultBox').innerHTML=`<div class="notice success" style="margin-top:14px"><b>Inspection completed.</b><br>The PDF uses the original official Word form layout.<div class="action-row"><button class="primary" onclick="sharePdf()">Share / Send PDF</button><button class="secondary" onclick="downloadPdf()">Save PDF</button></div></div>`;b.textContent='PDF generated';renderDashboard()}catch(e){alert(e.message);b.disabled=false;b.textContent='Generate official PDF'}}
async function sharePdf(){if(!pdfBlob)return;const file=new File([pdfBlob],pdfName,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:pdfName,text:'MAA fire safety inspection record'})}catch(e){if(e.name!=='AbortError')downloadPdf()}}else downloadPdf()}
function downloadPdf(){if(!pdfBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(pdfBlob);a.download=pdfName;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function goDashboard(){saveNotes();if(confirm('Return to dashboard? Your current progress will be saved on this device.')){show('dashboard');renderDashboard()}}
const isiOS=/iPhone|iPad|iPod/.test(navigator.userAgent), standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(isiOS&&!standalone)$('installHint').classList.add('show');
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});loadDashboard();
</script></body></html>
