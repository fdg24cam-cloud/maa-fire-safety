<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="MAA Checks">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>MAA Fire Safety Checks</title>
<style>
:root{--navy:#17324d;--ink:#1d2a34;--muted:#65737d;--bg:#f4f6f8;--card:#fff;--line:#dce3e8;--green:#166534;--red:#b42318;--amber:#8a5700;--blue:#155eef}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{padding-bottom:env(safe-area-inset-bottom)}header{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px}header h1{font-size:22px;margin:0 0 4px}header p{margin:0;opacity:.8;font-size:13px}main{max-width:820px;margin:auto;padding:18px}.hidden{display:none!important}.grid{display:grid;gap:12px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px #0000000b}.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.wrap{flex-wrap:wrap}.meta{font-size:13px;color:var(--muted);line-height:1.45}.title{font-size:20px;font-weight:800;margin:0}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;margin:18px 0 10px}.status{font-size:12px;font-weight:800;border-radius:999px;padding:5px 9px;white-space:nowrap}.due{background:#fee4e2;color:var(--red)}.complete{background:#dcfae6;color:var(--green)}.soon{background:#fff1c2;color:var(--amber)}.progressing{background:#e6efff;color:#1849a9}.sync{background:#eef4ff;color:#1849a9}.local{background:#fff1c2;color:#7a4d00}
button,.btn{border:0;border-radius:11px;padding:11px 13px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#e8edf1;color:var(--ink)}.danger{background:#fee4e2;color:var(--red)}.success{background:#dcfae6;color:var(--green)}.full{width:100%}.small{padding:7px 9px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.notice{border-radius:12px;padding:12px 14px;background:#eef4ff;color:#1849a9;font-size:13px;margin:10px 0}.notice.warn{background:#fff5d6;color:#7a4d00}.notice.good{background:#e7f8ec;color:#166534}.progress-wrap{height:9px;background:#e5ebef;border-radius:99px;overflow:hidden;margin:12px 0}.progress{height:100%;background:var(--navy);width:0}.counter{font-size:13px;color:var(--muted);font-weight:800}.loc-id{font-size:13px;color:var(--muted);font-weight:750}.loc{font-size:22px;line-height:1.25;margin:8px 0 16px;font-weight:800}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.choice{background:#edf1f4}.choice.pass.selected{background:#dcfae6;color:#166534}.choice.fail.selected{background:#fee4e2;color:#b42318}.choice.issue.selected{background:#fff1c2;color:#7a4d00}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid #cfd8df;font:inherit;background:white}.field textarea{min-height:84px;resize:vertical}.photo{border:1px dashed #bcc8d1;border-radius:14px;padding:10px;margin:12px 0;background:#fafbfc}.photo img{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:10px;background:#eee}.photo-empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}.badge{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#eef4ff;color:#1849a9}.summary-row,.history-item,.manage-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.summary-row:last-child,.history-item:last-child,.manage-row:last-child{border-bottom:0}.pill{font-size:11px;font-weight:850;border-radius:999px;padding:5px 7px}.pill.pass{background:#dcfae6;color:#166534}.pill.fail{background:#fee4e2;color:#b42318}.pill.issue{background:#fff1c2;color:#7a4d00}.manage-row.inactive{opacity:.55}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:50}.modal-card{background:white;width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}.modal-card h2{margin-top:0}.spacer{height:8px}@media(min-width:700px){.modal{align-items:center}.modal-card{border-radius:18px;max-height:85vh}}
</style></head><body>
<header><h1>MAA Fire Safety Checks</h1><p>Synced inspections, photos and editable check lists</p></header>
<main>
<section id="dashboard">
  <div class="row"><div><h2 class="title">Inspection dashboard</h2><div id="modeText" class="meta">Loading…</div></div><button class="secondary small" onclick="refreshAll()">Refresh</button></div>
  <div id="modeNotice"></div>
  <div id="testGrid" class="grid" style="margin-top:14px"></div>
  <div class="section-title">Completed inspection history</div><div id="history" class="panel"></div>
</section>

<section id="runner" class="hidden">
  <div class="top-actions"><button class="secondary" onclick="goDashboard()">← Dashboard</button><button class="secondary" onclick="openManage(current)">Manage items</button></div>
  <div class="panel"><div class="row"><div><h2 id="runTitle" class="title"></h2><div id="runFreq" class="meta"></div></div><div id="counter" class="counter"></div></div>
    <div class="progress-wrap"><div id="progress" class="progress"></div></div>
    <div class="row wrap"><div class="field" style="flex:1;min-width:180px"><label>Date</label><input type="date" id="inspectionDate"></div><div class="field" style="width:130px"><label>Initials</label><input id="initials" value="F.G."></div></div>
    <div id="locId" class="loc-id"></div><div id="loc" class="loc"></div>
    <div class="photo"><div id="photoFrame"></div><span id="photoBadge" class="badge hidden"></span><div class="actions" style="margin-top:9px"><label class="btn secondary small">📷 Take photo<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden onchange="photoSelected(this)"></label><label class="btn secondary small">🖼 Choose photo<input id="galleryInput" type="file" accept="image/*" hidden onchange="photoSelected(this)"></label><button id="removePhotoBtn" class="danger small hidden" onclick="removePhoto()">Remove photo</button></div></div>
    <div class="choices"><button class="choice pass" onclick="choose('PASS')">PASS</button><button class="choice fail" onclick="choose('FAIL')">FAIL</button><button class="choice issue" onclick="choose('ISSUE')">ISSUE</button></div>
    <div class="field"><label>Notes / action taken</label><textarea id="notes" placeholder="Optional. Use for faults, ticket number or action taken." onblur="saveNotes()"></textarea></div>
    <div class="row"><button class="secondary" onclick="prev()">← Previous</button><button class="primary" onclick="next()">Save & next →</button></div>
  </div>
</section>

<section id="review" class="hidden"><div class="top-actions"><button class="secondary" onclick="backToRunner()">← Back</button></div><div class="panel"><h2 class="title">Review inspection</h2><div id="summary"></div><button id="completeBtn" class="primary full" style="margin-top:14px" onclick="completeRun()">Generate official PDF & complete</button><div id="resultBox"></div></div></section>

<section id="manage" class="hidden"><div class="top-actions"><button class="secondary" onclick="closeManage()">← Back</button><button class="primary" onclick="editItem(null)">+ Add item</button></div><div class="panel"><div class="row"><div><h2 id="manageTitle" class="title"></h2><div class="meta">Add, correct, reorder or deactivate inspection items.</div></div></div><div id="manageList"></div></div></section>
</main>

<div id="editModal" class="modal hidden"><div class="modal-card"><div class="row"><h2 id="editHeading">Edit item</h2><button class="secondary small" onclick="closeEdit()">Close</button></div>
  <input type="hidden" id="editId"><div class="field"><label>Location / description</label><input id="editLocation"></div><div class="field"><label>ID (optional)</label><input id="editCode"></div><div id="typeField" class="field"><label>Extinguisher type</label><select id="editType"><option value="">Other / not specified</option><option>H₂O</option><option>CO₂</option><option>Foam</option><option>Powder</option></select></div><div class="field"><label>Order number</label><input id="editOrder" type="number" min="1"></div><div class="field"><label><input id="editActive" type="checkbox" checked style="width:auto"> Active in future inspections</label></div><button class="primary full" onclick="saveItem()">Save item</button><button id="deleteItemBtn" class="danger full hidden" style="margin-top:8px" onclick="deleteItem()">Delete added item</button>
</div></div>

<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let tests=[],mode='local',current=null,currentCfg=null,locations=[],answers=[],idx=0,inspectionId=null,pdfBlob=null,pdfName='',manageTest=null,manageItems=[];
const adminKey='maa_admin_pin_v1';
function show(id){['dashboard','runner','review','manage'].forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}
async function api(url,opts={}){const r=await fetch(url,opts);if(!r.ok){let msg='Request failed';try{msg=(await r.json()).error||msg}catch{}throw new Error(msg)}return r}
function headers(admin=false){const h={'Content-Type':'application/json'};if(admin){let pin=localStorage.getItem(adminKey)||'';if(!pin){pin=prompt('Enter the Admin PIN for editing inspection items:')||'';if(pin)localStorage.setItem(adminKey,pin)}h['X-Admin-Pin']=pin}return h}
function fmt(s){if(!s)return'';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function addMonths(iso,n){const d=new Date(iso+'T12:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.toISOString().slice(0,10)}
function statusFor(t){if(t.in_progress)return{state:'progressing',label:`In progress ${t.in_progress.completed_checks||0}/${t.in_progress.total_checks||t.count}`};if(!t.last_completed)return{state:'due',label:'Due'};const next=addMonths(t.last_completed.inspection_date,t.months),today=new Date().toISOString().slice(0,10),days=Math.ceil((new Date(next+'T12:00:00')-new Date(today+'T12:00:00'))/86400000);if(today>=next)return{state:'due',label:'Due'};if(days<=14)return{state:'soon',label:'Due soon'};return{state:'complete',label:'Up to date'}}
async function refreshAll(){await loadDashboard();}
async function loadDashboard(){try{const r=await api('/api/tests');const d=await r.json();tests=d.tests;mode=d.mode;$('modeText').innerHTML=mode==='supabase'?'<span class="status sync">Synced with Supabase</span>':'<span class="status local">Local mode</span>';$('modeNotice').innerHTML=mode==='supabase'?'':'<div class="notice warn"><b>Sync is not configured yet.</b> The app still opens, but cross-device progress and editable lists need Supabase environment variables on Render.</div>';renderDashboard();await loadHistory()}catch(e){$('testGrid').innerHTML=`<div class="notice warn">${esc(e.message)}</div>`}}
function renderDashboard(){$('testGrid').innerHTML=tests.map(t=>{const s=statusFor(t),last=t.last_completed;return `<div class="card"><div class="row"><div><h3 style="margin:0 0 4px">${esc(t.name)}</h3><div class="meta">${esc(t.frequency)} · ${t.count} active checks</div></div><span class="status ${s.state}">${esc(s.label)}</span></div><p class="meta">${esc(t.description||'')}</p>${last?`<div class="meta">Last completed: ${fmt(last.inspection_date)}</div>`:'<div class="meta">No completed synced record yet.</div>'}<div class="actions" style="margin-top:12px"><button class="primary" onclick="start('${t.id}')">${t.in_progress?'Resume inspection':'Start inspection'}</button><button class="secondary" onclick="openManage('${t.id}')">Manage items</button></div></div>`}).join('')}
async function loadHistory(){try{const r=await api('/api/history'),d=await r.json();$('history').innerHTML=d.history?.length?d.history.map(h=>`<div class="history-item"><div><b>${esc(h.test_name)}</b><div class="meta">${fmt(h.inspection_date)} · ${esc(h.initials||'')}</div></div><span class="status complete">Completed</span></div>`).join(''):'<div class="meta">No completed synced inspections yet.</div>'}catch{$('history').innerHTML='<div class="meta">History unavailable.</div>'}}
async function start(id){if(mode!=='supabase'){alert('This new synced version needs Supabase configured before starting shared inspections.');return}try{current=id;const t=tests.find(x=>x.id===id);const payload={test_id:id,inspection_date:new Date().toISOString().slice(0,10),initials:'F.G.'};const r=await api('/api/inspections/start',{method:'POST',headers:headers(),body:JSON.stringify(payload)}),d=await r.json();inspectionId=d.inspection.id;currentCfg={...t};locations=d.items;answers=locations.map(l=>{const rr=d.results[l.id]||{};return{result:rr.result||'',notes:rr.notes||''}});idx=Math.max(0,answers.findIndex(a=>!a.result));if(idx<0)idx=locations.length-1;$('runTitle').textContent=t.name;$('runFreq').textContent=t.frequency;$('inspectionDate').value=d.inspection.inspection_date;$('initials').value=d.inspection.initials||'F.G.';renderLoc();show('runner')}catch(e){alert(e.message)}}
function renderLoc(){if(!locations.length){alert('No active items. Add an item first.');openManage(current);return}const a=answers[idx],l=locations[idx];$('counter').textContent=`${idx+1} / ${locations.length}`;const done=answers.filter(x=>x.result).length;$('progress').style.width=`${Math.round(done/locations.length*100)}%`;$('locId').textContent=l.item_code?`ID ${l.item_code}`:'';$('loc').textContent=l.location;$('notes').value=a.notes||'';document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));if(a.result){const b=document.querySelector('.choice.'+a.result.toLowerCase());if(b)b.classList.add('selected')}renderPhoto()}
async function syncResult(){if(mode!=='supabase'||!inspectionId)return;const l=locations[idx],a=answers[idx];await api(`/api/inspections/${inspectionId}/result`,{method:'POST',headers:headers(),body:JSON.stringify({item_id:l.id,result:a.result,notes:a.notes||''})})}
async function choose(v){answers[idx].result=v;document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));document.querySelector('.choice.'+v.toLowerCase()).classList.add('selected');try{await syncResult();updateProgress()}catch(e){alert('Could not sync result: '+e.message)}}
function updateProgress(){const done=answers.filter(x=>x.result).length;$('progress').style.width=`${Math.round(done/locations.length*100)}%`}
async function saveNotes(){answers[idx].notes=$('notes').value.trim();try{await syncResult()}catch(e){alert('Could not sync notes: '+e.message)}}
async function next(){await saveNotes();if(!answers[idx].result){alert('Select PASS, FAIL or ISSUE before continuing.');return}if(idx<locations.length-1){idx++;renderLoc();window.scrollTo(0,0)}else openReview()}
function prev(){if(idx>0){idx--;renderLoc()}}
function photoSrc(l){if(l.photo_path)return `/api/item/${l.id}/photo?t=${Date.now()}`;return l.default_photo||''}
function renderPhoto(){const l=locations[idx],src=photoSrc(l);if(src){$('photoFrame').innerHTML=`<img src="${src}" alt="Reference photo for ${esc(l.location)}" onclick="window.open(this.src,'_blank')">`;$('photoBadge').textContent=l.photo_path?'Shared reference photo':'Original form photo';$('photoBadge').classList.remove('hidden');$('removePhotoBtn').classList.toggle('hidden',!l.photo_path)}else{$('photoFrame').innerHTML='<div class="photo-empty">No reference photo assigned yet.<br>Take one now so this location is easy to identify next time.</div>';$('photoBadge').classList.add('hidden');$('removePhotoBtn').classList.add('hidden')}}
async function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=url})}
async function photoSelected(input){const f=input.files?.[0];if(!f)return;try{const data=await compressImage(f),l=locations[idx];await api(`/api/item/${l.id}/photo`,{method:'POST',headers:headers(),body:JSON.stringify({data_url:data})});l.photo_path='shared';renderPhoto()}catch(e){alert('Could not save photo: '+e.message)}finally{input.value=''}}
async function removePhoto(){if(!confirm('Remove the shared replacement photo? The original form photo will return where available.'))return;try{const l=locations[idx];await api(`/api/item/${l.id}/photo`,{method:'DELETE'});l.photo_path=null;renderPhoto()}catch(e){alert(e.message)}}
async function openReview(){await saveNotes();const missing=answers.findIndex(a=>!a.result);if(missing>=0){idx=missing;renderLoc();alert('There are checks without a result.');return}$('summary').innerHTML=locations.map((l,i)=>`<div class="summary-row"><span class="pill ${answers[i].result.toLowerCase()}">${answers[i].result}</span><div style="flex:1"><b>${esc(l.location)}</b>${answers[i].notes?`<div class="meta">${esc(answers[i].notes)}</div>`:''}</div></div>`).join('');$('resultBox').innerHTML='';show('review')}
function backToRunner(){show('runner');renderLoc()}
async function completeRun(){const b=$('completeBtn');b.disabled=true;b.textContent='Generating PDF…';try{const payload={inspection_date:$('inspectionDate').value,initials:$('initials').value.trim()||'F.G.'};const r=await api(`/api/inspections/${inspectionId}/complete`,{method:'POST',headers:headers(),body:JSON.stringify(payload)});pdfBlob=await r.blob();const cd=r.headers.get('content-disposition')||'';pdfName=(cd.match(/filename="?([^";]+)"?/i)||[])[1]||`MAA_${current}_${payload.inspection_date}.pdf`;$('resultBox').innerHTML=`<div class="notice good"><b>Inspection completed and synced.</b><div class="actions" style="margin-top:10px"><button class="primary" onclick="sharePdf()">Share / Send PDF</button><button class="secondary" onclick="downloadPdf()">Save PDF</button></div></div>`;b.textContent='PDF generated';await loadDashboard()}catch(e){alert(e.message);b.disabled=false;b.textContent='Generate official PDF & complete'}}
async function sharePdf(){if(!pdfBlob)return;const f=new File([pdfBlob],pdfName,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:pdfName})}catch(e){if(e.name!=='AbortError')downloadPdf()}}else downloadPdf()}
function downloadPdf(){if(!pdfBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(pdfBlob);a.download=pdfName;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function goDashboard(){await saveNotes();show('dashboard');await loadDashboard()}

// ----- Manage items -----
async function openManage(tid){if(mode!=='supabase'){alert('Editable inspection lists require Supabase configuration.');return}manageTest=tid;try{const r=await api('/api/manage/items/'+tid,{headers:headers(true)}),d=await r.json();manageItems=d.items;$('manageTitle').textContent=tests.find(t=>t.id===tid)?.name||tid;renderManage();show('manage')}catch(e){if(String(e.message).includes('PIN'))localStorage.removeItem(adminKey);alert(e.message)}}
function closeManage(){if(current&&current===manageTest&&!$('runner').classList.contains('hidden'))show('runner');else{show('dashboard');loadDashboard()}}
function renderManage(){$('manageList').innerHTML=manageItems.length?manageItems.map(x=>`<div class="manage-row ${x.active?'':'inactive'}"><div style="flex:1"><b>${esc(x.location)}</b><div class="meta">${x.item_code?`ID ${esc(x.item_code)} · `:''}${x.extinguisher_type?`${esc(x.extinguisher_type)} · `:''}Order ${x.sort_order}${x.source_kind==='official'?' · Official form item':' · Added item'}${x.active?'':' · INACTIVE'}</div></div><div class="actions"><button class="secondary small" onclick="editItem('${x.id}')">Edit</button><button class="${x.active?'danger':'success'} small" onclick="toggleItem('${x.id}',${x.active})">${x.active?'Deactivate':'Activate'}</button></div></div>`).join(''):'<div class="meta">No items.</div>'}
function editItem(id){const x=id?manageItems.find(v=>v.id===id):null;$('editId').value=x?.id||'';$('editHeading').textContent=x?'Edit item':'Add item';$('editLocation').value=x?.location||'';$('editCode').value=x?.item_code||'';$('editType').value=x?.extinguisher_type||'';$('editOrder').value=x?.sort_order||((manageItems.reduce((m,v)=>Math.max(m,+v.sort_order||0),0))+1);$('editActive').checked=x?!!x.active:true;$('typeField').classList.toggle('hidden',manageTest!=='extinguishers');$('deleteItemBtn').classList.toggle('hidden',!x||x.source_kind==='official');$('editModal').classList.remove('hidden')}
function closeEdit(){$('editModal').classList.add('hidden')}
async function saveItem(){const payload={id:$('editId').value||null,test_id:manageTest,location:$('editLocation').value.trim(),item_code:$('editCode').value.trim(),extinguisher_type:manageTest==='extinguishers'?$('editType').value:'',sort_order:+$('editOrder').value||999,active:$('editActive').checked};if(!payload.location){alert('Location is required.');return}try{await api('/api/manage/item',{method:'POST',headers:headers(true),body:JSON.stringify(payload)});closeEdit();await openManage(manageTest)}catch(e){alert(e.message)}}
async function toggleItem(id,isActive){if(!confirm(isActive?'Deactivate this item for future inspections?':'Activate this item again?'))return;try{await api(`/api/manage/item/${id}/${isActive?'deactivate':'activate'}`,{method:'POST',headers:headers(true),body:'{}'});await openManage(manageTest)}catch(e){alert(e.message)}}
async function deleteItem(){const id=$('editId').value;if(!id||!confirm('Delete this added item? This is only allowed if it has no inspection history.'))return;try{await api(`/api/manage/item/${id}/delete`,{method:'POST',headers:headers(true),body:'{}'});closeEdit();await openManage(manageTest)}catch(e){alert(e.message)}}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
loadDashboard();setInterval(()=>{if(!$('dashboard').classList.contains('hidden'))loadDashboard()},10000);
</script></body></html>
